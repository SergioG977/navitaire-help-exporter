name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository safety check
        run: python scripts/check_repo_safety.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Tests (synthetic fixtures only)
        run: pytest

      - name: CLI smoke test
        run: |
          navhelp families
          navhelp mcp --help
